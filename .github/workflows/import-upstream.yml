name: 首次导入 HowToCook
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-upstream.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cookbook-first-import
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: 导入及验证固定版本
        run: |
          if [ -e upstream-lock.json ]; then
            python scripts/validate_content.py
            exit 0
          fi
          python scripts/sync_upstream.py --sha 25854882a423d7dbd6f6146b6554e2fa3b8f9804
          python scripts/validate_content.py
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream upstream-lock.json
          git commit -m "chore: import the complete HowToCook content at 25854882"
          git push origin HEAD:main
