name: 内容检查与发布
on:
  push:
    branches: [main]
    paths: ['upstream/**', 'upstream-lock.json', 'metadata/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python scripts/validate_content.py
  release:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: 请求主站发布
        env:
          GH_TOKEN: ${{ secrets.SITE_RELEASE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::尚未配置 SITE_RELEASE_DISPATCH_TOKEN，本次仅执行内容检查。"
            exit 0
          fi
          gh workflow run pages-release.yml --repo urixie/urixie.github.io --ref main
